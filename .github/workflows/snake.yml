name: generate snake

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Halve snake animation speed
        run: |
          python3 -c "
          import re, glob
          for svg in glob.glob('dist/*.svg'):
              with open(svg, 'r', encoding='utf-8') as f:
                  content = f.read()
              def halve_speed(m):
                  ms = int(m.group(1)) * 2
                  return m.group(0).replace(f'{m.group(1)}ms', f'{ms}ms')
              new_content = re.sub(r'animation:[^;}]*?(\d+)ms', halve_speed, content)
              with open(svg, 'w', encoding='utf-8') as f:
                  f.write(new_content)
          "

      - name: Validate generated snake has activity
        id: check_snake
        run: |
          FILE_SIZE=$(wc -c < dist/github-contribution-grid-snake-dark.svg)
          echo "Generated snake dark SVG size: $FILE_SIZE bytes"
          if [ "$FILE_SIZE" -gt 30000 ]; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "::warning ::Snake SVG is under 30KB (0 contributions returned by GitHub API). Skipping deploy to preserve existing animated snake."
          fi

      - name: Push to output branch
        if: steps.check_snake.outputs.valid == 'true'
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
